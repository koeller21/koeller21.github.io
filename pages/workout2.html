<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>workout</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('wtheme')||'light'}catch(e){}</script>
<style>
/* ============ tokens ============ */
:root{
	color-scheme: dark;
	--font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

	/* chatgpt-app dark: neutral charcoal, zero color cast */
	--base:#0d0d0d;
	--drawer-bg:#171717;
	--label:#ececec;
	--label-2:#9b9b9b;
	--label-3:#676767;
	--sep:rgba(255,255,255,.10);
	--hairline:rgba(255,255,255,.07);
	--hairline-hi:rgba(255,255,255,.10);
	--fill:#212121;
	--fill-press:#2f2f2f;

	--card-bg:#171717;
	--glass-bar:#1e1e1e;          /* solid fallback */
	--glass-card:#1e1e1e;
	--glass-t:rgba(32,32,32,.55);      /* translucent glass, neutral */
	--glass-card-t:rgba(28,28,28,.72);
	--blur:blur(22px) saturate(160%);
	--spec-top:rgba(255,255,255,.16);  /* faux-lens rim: bright top edge, faint bottom bounce */
	--spec-bot:rgba(255,255,255,.05);
	--pane-edge:rgba(255,255,255,.07);
	--pane-shadow:rgba(0,0,0,.5);

	--cta:#ececec;          /* inverted button, chatgpt-style */
	--cta-label:#0d0d0d;
	--tint:#ececec;         /* charts & emphasis stay monochrome */
	--green:#10a37f;
	--red:#ef4146;

	--r-ctl:10px; --r-card:14px; --r-sheet:18px; --r-pane:16px;
	--gutter:16px; --row:44px;
	--ease:cubic-bezier(.32,.72,0,1);
	--dw:min(78vw, 320px);
}
[data-theme="light"]{
	color-scheme: light;
	/* chatgpt-app light: white + warm neutral grays */
	--base:#ffffff;
	--drawer-bg:#f9f9f9;
	--label:#0d0d0d;
	--label-2:#8e8e8e;
	--label-3:#b4b4b4;
	--sep:rgba(0,0,0,.08);
	--hairline:rgba(0,0,0,.06);
	--hairline-hi:rgba(0,0,0,.04);
	--fill:#f0f0f0;
	--fill-press:#e3e3e3;
	--card-bg:#f7f7f7;
	--glass-bar:#ffffff;
	--glass-card:#ffffff;
	--cta:#0d0d0d;
	--cta-label:#ffffff;
	--tint:#0d0d0d;
	--green:#10a37f;
	--red:#d00e17;
	--glass-t:rgba(255,255,255,.6);
	--glass-card-t:rgba(252,252,252,.8);
	--spec-top:rgba(255,255,255,.9);
	--spec-bot:rgba(255,255,255,.35);
	--pane-edge:rgba(0,0,0,.08);
	--pane-shadow:rgba(0,0,0,.05);
}

/* ============ reset / shell ============ */
*{ box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
html{ overscroll-behavior:none; -webkit-text-size-adjust:100%; }
body{
	font-family:var(--font); font-size:17px; line-height:22px; letter-spacing:-0.025em;
	color:var(--label); background:var(--drawer-bg);   /* one continuous under-layer behind the pane */
	overflow:hidden; height:100dvh;
	-webkit-font-smoothing:antialiased;
}
button{ font:inherit; color:inherit; background:none; border:0; padding:0; text-align:inherit; }
button, .row{ touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.num{ font-variant-numeric:tabular-nums; }

/* ============ drawer (beneath) ============ */
#drawer{
	position:fixed; inset:0 auto 0 0; width:var(--dw); z-index:0;
	display:flex; flex-direction:column;
	background:var(--drawer-bg);
	padding:calc(env(safe-area-inset-top) + 14px) 10px calc(env(safe-area-inset-bottom) + 10px);
	transform:translateX(-16%);
	transition:transform .32s var(--ease);
	will-change:transform;
}
#drawer > *{ position:relative; }
.dhead{ font-size:13px; line-height:18px; letter-spacing:0; color:var(--label-3); padding:18px 12px 6px; }
.drow{
	display:flex; align-items:center; gap:10px; width:100%;
	min-height:var(--row); padding:10px 12px; border-radius:var(--r-ctl);
	font-size:16px; letter-spacing:-0.02em;
}
.drow:active{ background:var(--fill-press); }
.drow .sub{ margin-left:auto; font-size:13px; color:var(--label-3); letter-spacing:0; }
.drow.sel{ background:var(--fill); }
.due{
	font-size:11px; line-height:1; letter-spacing:.02em;
	color:var(--cta-label); background:var(--cta);
	border-radius:999px; padding:4px 8px; margin-left:8px; font-weight:600;
}
.dscroll{ flex:1; overflow-y:auto; overscroll-behavior:contain; min-height:0; }
.dfoot{
	display:flex; align-items:center; gap:6px;
	padding-top:10px; border-top:1px solid var(--hairline);
}
.dfoot .drow{ flex:1; }
.iconbtn{
	width:40px; height:40px; border-radius:999px; flex-shrink:0;
	display:grid; place-items:center; color:var(--label-2);
}
.iconbtn:active{ background:var(--fill-press); }

/* ============ main pane (slides) ============ */
#pane{
	position:relative; z-index:1; height:100dvh;
	display:flex; flex-direction:column;
	background:var(--base);
	transform-origin:center left;
	transition:transform .32s var(--ease), border-radius .32s var(--ease);
	will-change:transform;
}
#pane > *{ position:relative; z-index:1; }
.is-open #drawer{ transform:translateX(0); }
.is-open #pane{
	transform:translateX(var(--dw)) scale(.94);
	border-radius:var(--r-pane); overflow:hidden;
	box-shadow:-1px 0 0 var(--pane-edge), -8px 0 40px var(--pane-shadow);   /* edge belongs to the pane, slides with it */
}
#scrim{
	position:absolute; inset:0; z-index:40;
	background:transparent; pointer-events:none;   /* invisible tap-to-close target, never dims */
}
.is-open #scrim{ pointer-events:auto; }

/* ============ floating header (detached glass islands) ============ */
#topbar{
	position:absolute; top:0; left:0; right:0; z-index:30;
	display:flex; align-items:center; gap:8px;
	padding:calc(env(safe-area-inset-top) + 10px) 12px 0;
	pointer-events:none;
}
#topbar > *{ pointer-events:auto; }
.fab{
	background:var(--glass-bar); color:var(--label);
	border-radius:999px;
	box-shadow:inset 0 1px 0 var(--spec-top), inset 0 -1px 0 var(--spec-bot),
	           0 0 0 .5px var(--hairline), 0 4px 16px rgba(0,0,0,.18);
	transition:transform .12s var(--ease);
}
.fab:active{ transform:scale(.94); }
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
	.fab{ background:var(--glass-t); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); }
}
#topbar .iconbtn{ width:44px; height:44px; color:var(--label); }
.pills{ margin-left:auto; display:flex; gap:8px; }
.pill{
	font-size:13px; line-height:1; letter-spacing:0;
	padding:0 14px; min-height:44px; display:flex; align-items:center;
	color:var(--label-2);
}
.pill b{ color:var(--label); font-weight:600; }
.pill.over b{ color:var(--red); }

/* ============ content ============ */
#scroll{
	flex:1; overflow-y:auto; overscroll-behavior-y:contain; min-height:0;
	padding:calc(env(safe-area-inset-top) + 66px) var(--gutter) calc(env(safe-area-inset-bottom) + 40px);
}
.lt{ font-size:34px; line-height:41px; letter-spacing:-0.03em; font-weight:700; margin-top:14px; }
.lt .done{ color:var(--green); font-size:24px; vertical-align:2px; }
.subtitle{ font-size:13px; line-height:18px; letter-spacing:0; color:var(--label-2); margin:2px 0 18px; }

/* exercise card */
.xcard{
	background:var(--card-bg);
	border-radius:var(--r-card);
	box-shadow:0 0 0 .5px var(--hairline);
	margin-bottom:14px; overflow:hidden;
}
.xhead{
	display:flex; align-items:baseline; gap:8px; width:100%;
	padding:13px 16px 2px;
}
.xhead:active .xname{ opacity:.6; }
.xname{ font-size:17px; font-weight:600; letter-spacing:-0.025em; }
.xlast{ margin-left:auto; font-size:13px; letter-spacing:0; color:var(--label-3); }
.xhead .chev{ color:var(--label-3); font-size:14px; }
.setrow{
	position:relative; display:flex; align-items:center; gap:12px;
	min-height:var(--row); padding:6px 16px;
}
.setrow + .setrow::before{
	content:""; position:absolute; top:0; left:16px; right:0; height:1px;
	background:var(--sep); transform:scaleY(.5); transform-origin:top;
}
.setno{ font-size:13px; color:var(--label-3); width:14px; letter-spacing:0; }
.setval{
	font-size:17px; letter-spacing:-0.02em; padding:6px 10px; margin-left:-10px;
	border-radius:8px;
}
.setval:active{ background:var(--fill-press); }
.setval small{ font-size:13px; color:var(--label-2); font-weight:400; }
.setrow.done .setval{ color:var(--label-2); }
.confirm{
	margin-left:auto; width:30px; height:30px; border-radius:999px; flex-shrink:0;
	display:grid; place-items:center;
	border:1.5px solid var(--label-3); color:transparent;
	font-size:15px; font-weight:700;
	transition:transform .15s var(--ease), background .15s, border-color .15s;
}
.confirm:active{ transform:scale(.9); }
.setrow.done .confirm{ background:var(--green); border-color:var(--green); color:#fff; }
.addx{
	display:block; width:100%; padding:13px 16px;
	background:var(--card-bg); border-radius:var(--r-card);
	box-shadow:0 0 0 .5px var(--hairline);
	color:var(--label-2); font-size:16px; letter-spacing:-0.02em;
	margin-bottom:14px;
}
.addx:active{ background:var(--fill-press); }

/* ============ floating card (AirPods style) ============ */
dialog.fcard{
	position:fixed; inset:auto 8px calc(env(safe-area-inset-bottom) + 8px + var(--kb, 0px)) 8px;
	width:auto; max-width:560px; margin-inline:auto;
	max-height:min(86dvh, calc(100dvh - var(--kb, 0px) - 72px));   /* shrink above the keyboard */
	padding:0; border:0;
	border-radius:var(--r-sheet);
	background:var(--glass-card); color:var(--label);
	box-shadow:inset 0 1px 0 var(--spec-top), inset 0 -1px 0 var(--spec-bot),
	           0 0 0 .5px var(--hairline), 0 18px 60px rgba(0,0,0,.45);
	transform:translateY(calc(100% + 40px));
	transition:transform .36s var(--ease);
	display:flex; flex-direction:column;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
	dialog.fcard{ background:var(--glass-card-t); -webkit-backdrop-filter:blur(28px) saturate(160%); backdrop-filter:blur(28px) saturate(160%); }
}
dialog.fcard[open]{ transform:translateY(0); }
@starting-style{ dialog.fcard[open]{ transform:translateY(calc(100% + 40px)); } }
dialog.fcard::backdrop{
	background:rgba(0,0,0,.4); opacity:0;
	transition:opacity .36s var(--ease);
}
dialog.fcard[open]::backdrop{ opacity:1; }
@starting-style{ dialog.fcard[open]::backdrop{ opacity:0; } }
.dragzone{ padding:8px 0 4px; flex-shrink:0; touch-action:none; cursor:grab; }
.grab{ width:36px; height:5px; border-radius:2.5px; background:var(--label-3); margin:0 auto; }
dialog.fcard.closing{ transform:translateY(calc(100% + 40px)) !important; transition-duration:.24s; }
dialog.fcard.closing::backdrop{ opacity:0; }
.fbody{ padding:14px 20px calc(20px); overflow-y:auto; overscroll-behavior:contain; }
.ftitle{ font-size:22px; line-height:28px; letter-spacing:-0.026em; font-weight:700; text-align:center; margin:6px 0 2px; }
.fsub{ font-size:13px; letter-spacing:0; color:var(--label-2); text-align:center; margin-bottom:14px; }

/* steppers */
.step{ display:flex; align-items:center; justify-content:center; gap:18px; margin:10px 0; }
.step .val{ font-size:44px; line-height:1.1; font-weight:700; letter-spacing:-0.03em; min-width:150px; text-align:center; }
.step .val small{ font-size:15px; font-weight:500; color:var(--label-2); letter-spacing:0; }
.step input{
	width:150px; font-size:34px; font-weight:700; text-align:center;
	background:var(--fill); border:0; border-radius:12px; padding:6px 8px; color:var(--label); outline:none;
}
.sbtn{
	width:54px; height:54px; border-radius:999px; flex-shrink:0;
	background:var(--fill); color:var(--label);
	font-size:28px; font-weight:500; line-height:1;
	display:grid; place-items:center;
	box-shadow:inset 0 .5px 0 var(--hairline-hi);
	transition:transform .12s var(--ease);
}
.sbtn:active{ background:var(--fill-press); transform:scale(.92); }
.cta{
	display:block; width:100%; min-height:50px; margin-top:14px;
	border-radius:999px; background:var(--cta); color:var(--cta-label);
	font-size:17px; font-weight:600; text-align:center; letter-spacing:-0.02em;
	transition:transform .12s var(--ease);
}
.cta:active{ transform:scale(.97); opacity:.85; }
.cta.plain{ background:var(--fill); color:var(--label); }
.cta.danger{ background:transparent; color:var(--red); min-height:44px; margin-top:6px; }

/* list inside cards (entries, history, settings) */
.flist{ margin-top:12px; border-radius:12px; background:var(--fill); overflow:hidden; }
.frow{ position:relative; display:flex; align-items:center; gap:10px; width:100%; min-height:var(--row); padding:8px 14px; font-size:15px; letter-spacing:0; }
.frow + .frow::before{ content:""; position:absolute; top:0; left:14px; right:0; height:1px; background:var(--sep); transform:scaleY(.5); }
.frow .sub{ color:var(--label-2); }
.frow .end{ margin-left:auto; color:var(--label-2); }
.frow .del{ color:var(--red); font-size:13px; }
button.frow:active{ background:var(--fill-press); }
.note{ font-size:13px; letter-spacing:0; color:var(--label-2); text-align:center; margin-top:12px; }

/* progress cards */
.pcard{ display:block; width:100%; padding:14px 16px 12px; }
.pcard:active{ background:var(--fill-press); }
.phead{ display:flex; align-items:baseline; gap:8px; }
.phead .xlast{ margin-left:auto; }
.spark{ display:block; width:100%; margin:10px 0 4px; }
.spark polyline{ fill:none; stroke:var(--tint); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.spark circle{ fill:var(--tint); }
.pfoot{ display:flex; align-items:baseline; font-size:13px; letter-spacing:0; color:var(--label-2); }
.pfoot .delta{ margin-left:auto; color:var(--green); font-weight:600; }

/* chart */
.chart{ display:block; margin:8px auto 0; }
.fbody .chart{ margin-top:26px; }        /* air between actions and the graph */
.chart .grid{ stroke:var(--sep); }
.chart .tick{ fill:var(--label-3); font:10px var(--font); letter-spacing:0; }
.chart polyline{ fill:none; stroke:var(--tint); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.chart .xh{ stroke:var(--label-3); }
.chart .sel{ fill:var(--tint); stroke:var(--base); stroke-width:2; }
.readout{ font-size:14px; letter-spacing:0; color:var(--label-2); text-align:center; margin-top:6px; font-variant-numeric:tabular-nums; }

/* misc */
input.plain{
	width:100%; min-height:46px; font-size:17px; padding:10px 14px;
	border-radius:12px; border:0; background:var(--fill); color:var(--label);
	outline:none; margin-top:8px;
}

/* ============ desktop: docked two-pane, chatgpt-style ============ */
@media (min-width: 900px){
	#drawer{ transform:none; transition:none; }
	#pane, .is-open #pane{
		margin-left:var(--dw);
		transform:none; border-radius:0; overflow:visible;
		box-shadow:-1px 0 0 var(--pane-edge);      /* the pane's own edge, nothing on the sidebar */
	}
	#scrim{ display:none; }
	#topbar [data-act="menu"]{ display:none; }
	#topbar{ padding-left:20px; }
	#scroll{ padding-inline:max(24px, calc((100% - 680px) / 2)); }   /* centered content column */
}

@media (prefers-reduced-motion: reduce){
	*, *::before, *::after{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
	.is-open #pane{ transform:none; border-radius:0; }
	#drawer{ transform:none; }
}
@media (hover:hover) and (pointer:fine){
	.drow:hover, .pill:hover, .sbtn:hover, button.frow:hover{ background:var(--fill-press); }
}
</style>
</head>
<body>

<aside id="drawer" aria-hidden="true">
	<button class="drow" data-act="adhoc">＋&nbsp; Ad-hoc workout</button>
	<div class="dhead">ROUTINES</div>
	<div id="droutines"></div>
	<div class="dhead">PROGRESS</div>
	<div class="dscroll" id="dprogress"></div>
	<div class="dfoot">
		<button class="drow" data-act="settings">⚙&nbsp; Settings</button>
		<button class="iconbtn" data-act="theme" aria-label="toggle theme">◐</button>
	</div>
</aside>

<div id="pane">
	<header id="topbar">
		<button class="iconbtn fab" data-act="menu" aria-label="menu">
			<svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 6h14M3 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
		</button>
		<div class="pills">
			<button class="pill fab num" id="kc" data-act="cal"></button>
			<button class="pill fab num" id="kw" data-act="wt"></button>
		</div>
	</header>
	<main id="scroll">
		<h1 class="lt" id="title"></h1>
		<p class="subtitle" id="subtitle"></p>
		<div id="cards"></div>
	</main>
	<div id="scrim" data-act="menu"></div>
</div>

<dialog class="fcard" id="fcard">
	<div class="dragzone" id="dragzone"><div class="grab"></div></div>
	<div class="fbody" id="fbody"></div>
</dialog>
<input type="file" id="importfile" accept="application/json" hidden>

<script>
/* =================================================================
   state: single key "wapp"
   { v:2, ex:[{name,min,max,inc}], routines:[{name,ex:[names]}],
     sessions:[{d,r,sets:{name:{w,r:[s1,s2]}}}],   // r entries may be null = not logged
     cal:{b,d:{date:[kcal|{v,n}]}}, wt:[{d,kg}] }
   ================================================================= */
var KEY = 'wapp', ADHOC = 'Ad-hoc';
var S, view = {t:'session', r:null};
var fcard, fbody, rows, titleEl, subEl;

function DEFAULTS(){
	return { v:2,
		ex:[
			{name:'Overhead Press',      min:6,  max:8,  inc:2.5},
			{name:'Incline Chest Press', min:6,  max:8,  inc:2.5},
			{name:'Triceps Extension',   min:8,  max:10, inc:1.25},
			{name:'Lateral Raises',      min:10, max:12, inc:1.25},
			{name:'Abs',                 min:12, max:20, inc:1.25},
			{name:'Lat Pulldown',        min:6,  max:8,  inc:2.5},
			{name:'Seated Row',          min:8,  max:10, inc:2.5},
			{name:'Deadlift',            min:5,  max:8,  inc:2.5},
			{name:'Biceps Curl',         min:8,  max:10, inc:1.25},
			{name:'Hack Squat',          min:8,  max:12, inc:2.5},
			{name:'Leg Extension',       min:10, max:15, inc:1.25},
			{name:'Leg Curl',            min:8,  max:10, inc:1.25}
		],
		routines:[
			{name:'Push', ex:['Overhead Press','Incline Chest Press','Triceps Extension','Lateral Raises','Abs']},
			{name:'Pull', ex:['Lat Pulldown','Seated Row','Deadlift','Biceps Curl','Abs']},
			{name:'Legs', ex:['Hack Squat','Leg Extension','Leg Curl']}
		],
		sessions:[], cal:{b:0, d:{}}, wt:[] };
}

/* old formats: wlog array of {name,grp,min,max,inc,log:[{d,w,r}]} (+ wcal/wwt) */
function migrateOld(oldEx, oldCal, oldWt){
	var st = DEFAULTS(); st.ex = []; st.routines = []; st.sessions = [];
	var seen = {}, grps = {};
	(oldEx || []).forEach(function(e){
		if(!e || typeof e.name !== 'string') return;
		if(!seen[e.name]){ seen[e.name] = 1; st.ex.push({name:e.name, min:+e.min||1, max:+e.max||10, inc:+e.inc||0}); }
		var g = String(e.grp || 'Other'); g = g.charAt(0).toUpperCase() + g.slice(1).toLowerCase();
		if(!grps[g]){ grps[g] = {name:g, ex:[]}; st.routines.push(grps[g]); }
		if(grps[g].ex.indexOf(e.name) < 0) grps[g].ex.push(e.name);
		(e.log || []).forEach(function(en){
			if(!en || typeof en.d !== 'string' || typeof en.w !== 'number' || !Array.isArray(en.r)) return;
			var sess = null;
			for(var i = 0; i < st.sessions.length; i++)
				if(st.sessions[i].d === en.d && st.sessions[i].r === g){ sess = st.sessions[i]; break; }
			if(!sess){ sess = {d:en.d, r:g, sets:{}}; st.sessions.push(sess); }
			sess.sets[e.name] = {w:en.w, r:[en.r[0] == null ? null : en.r[0], en.r[1] == null ? null : en.r[1]]};
		});
	});
	if(oldCal && typeof oldCal === 'object' && oldCal.d) st.cal = {b:+oldCal.b || 0, d:oldCal.d};
	if(Array.isArray(oldWt)) st.wt = oldWt;
	st.sessions.sort(function(a, b){ return a.d < b.d ? -1 : 1; });
	return st;
}

function validState(s){
	return s && s.v === 2 && Array.isArray(s.ex) && Array.isArray(s.routines) && Array.isArray(s.sessions)
		&& s.cal && typeof s.cal.d === 'object' && Array.isArray(s.wt);
}
function jparse(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function load(){
	var s = jparse(KEY);
	if(validState(s)) return s;
	var old = jparse('wlog');
	if(Array.isArray(old)){
		var st = migrateOld(old, jparse('wcal'), jparse('wwt'));
		localStorage.setItem(KEY, JSON.stringify(st));
		return st;
	}
	return DEFAULTS();
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

/* ================= helpers ================= */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function today(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function fmtDate(d){ var p = d.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
function num(x){ return Math.round(x * 100) / 100; }
function exByName(n){ for(var i = 0; i < S.ex.length; i++) if(S.ex[i].name === n) return S.ex[i]; return null; }
function routineByName(n){ for(var i = 0; i < S.routines.length; i++) if(S.routines[i].name === n) return S.routines[i]; return null; }

function lastDone(rname){
	var d = null;
	S.sessions.forEach(function(s){ if(s.r === rname && (!d || s.d > d)) d = s.d; });
	return d;
}
function daysAgoStr(d){
	if(!d) return 'never';
	var n = Math.round((new Date(today()) - new Date(d)) / 864e5);
	return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago';
}
function suggested(){
	var best = null, bestD = null;
	S.routines.forEach(function(r){
		var d = lastDone(r.name) || '0000';
		if(bestD === null || d < bestD){ bestD = d; best = r.name; }
	});
	return best;
}
function sessCount(rname){ var n = 0; S.sessions.forEach(function(s){ if(s.r === rname) n++; }); return n; }
function todaySession(rname){
	for(var i = 0; i < S.sessions.length; i++)
		if(S.sessions[i].d === today() && S.sessions[i].r === rname) return S.sessions[i];
	return null;
}
function ensureSession(rname){
	var s = todaySession(rname);
	if(!s){ s = {d:today(), r:rname, sets:{}}; S.sessions.push(s); S.sessions.sort(function(a, b){ return a.d < b.d ? -1 : 1; }); }
	return s;
}
function cleanupSession(s){
	Object.keys(s.sets).forEach(function(n){
		var e = s.sets[n];
		if(e.r[0] == null && e.r[1] == null) delete s.sets[n];
	});
	if(!Object.keys(s.sets).length){
		var i = S.sessions.indexOf(s);
		if(i >= 0) S.sessions.splice(i, 1);
	}
}

/* per-exercise history across all sessions; excludeToday keeps targets stable mid-day */
function histFor(name, excludeToday){
	var out = [];
	S.sessions.forEach(function(s){
		if(excludeToday && s.d === today()) return;
		var e = s.sets[name];
		if(e && e.r && e.r[0] != null) out.push({d:s.d, w:e.w, r:e.r});
	});
	return out;
}

/* double progression + deload; null = no suggestion (no history, or inc 0 = progression off) */
function computeNext(def){
	var hist = histFor(def.name, true);
	if(!def.inc || !hist.length) return null;
	var last = hist[hist.length - 1], s1 = last.r[0], s2 = last.r[1] == null ? 0 : last.r[1], w = last.w;
	if(s1 >= def.max && s2 >= def.min) return {w:num(w + def.inc), reps:def.min};
	if(s1 >= def.min) return {w:w, reps:Math.min(s1 + 1, def.max)};
	var st = 0;
	for(var i = hist.length - 1; i >= 0 && hist[i].r[0] < def.min; i--) st++;
	if(st >= 3) return {w:Math.max(0, num(w - def.inc)), reps:def.min};
	return {w:w, reps:def.min};
}

function e1rm(w, r){ return w * (1 + r / 30); }
function calV(x){ return typeof x === 'number' ? x : x.v; }
function calN(x){ return typeof x === 'number' || !x.n ? '' : x.n; }
function calSum(a){ var s = 0; for(var k = 0; k < a.length; k++) s += calV(a[k]); return s; }

/* ================= charts ================= */
function chartSvg(ds, vals){
	if(vals.length < 2) return '';
	var W = Math.min(500, innerWidth - 72), H = 170;
	var T = 8, B = H - 22, L = 38, R = W - 8, n = vals.length;
	var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
	if(min === max){ min -= 1; max += 1; }
	var yOf = function(v){ return (T + (1 - (v - min) / (max - min)) * (B - T)).toFixed(1); };
	var step = Math.pow(10, Math.floor(Math.log(max - min) / Math.LN10));
	if((max - min) / step >= 5) step *= 2; else if((max - min) / step < 2) step /= 2;
	var s = '';
	for(var v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step)
		s += '<line class="grid" x1="' + L + '" y1="' + yOf(v) + '" x2="' + R + '" y2="' + yOf(v) + '"/>'
		   + '<text class="tick num" x="' + (L - 7) + '" y="' + (+yOf(v) + 3) + '" text-anchor="end">' + num(v) + '</text>';
	var pts = [];
	for(var k = 0; k < n; k++)
		pts.push((L + k * (R - L) / (n - 1)).toFixed(1) + ',' + yOf(vals[k]));
	var lp = pts[n - 1].split(',');
	return '<svg class="chart" width="' + W + '" height="' + H + '">'
		+ s
		+ '<line class="grid" x1="' + L + '" y1="' + B + '" x2="' + R + '" y2="' + B + '"/>'
		+ '<text class="tick" x="' + L + '" y="' + (H - 5) + '">' + fmtDate(ds[0]) + '</text>'
		+ '<text class="tick" x="' + R + '" y="' + (H - 5) + '" text-anchor="end">' + fmtDate(ds[n - 1]) + '</text>'
		+ '<line class="xh" x1="' + lp[0] + '" y1="' + T + '" x2="' + lp[0] + '" y2="' + B + '"/>'
		+ '<polyline points="' + pts.join(' ') + '"/>'
		+ '<circle class="sel" cx="' + lp[0] + '" cy="' + lp[1] + '" r="4"/>'
		+ '</svg>';
}
/* tap/drag on the card's chart -> fmt(k) into its .readout */
function wireChart(fmt){
	var svg = fbody.querySelector('.chart'), ro = fbody.querySelector('.readout');
	if(!svg || !ro) return;
	var P = svg.querySelector('polyline').getAttribute('points').split(' ').map(function(p){ return p.split(','); });
	var xh = svg.querySelector('.xh'), dot = svg.querySelector('.sel');
	var pick = function(ev){
		if(ev.type === 'pointermove' && !ev.buttons) return;
		var f = (ev.clientX - svg.getBoundingClientRect().left - P[0][0]) / (P[P.length - 1][0] - P[0][0]);
		var k = Math.max(0, Math.min(P.length - 1, Math.round(f * (P.length - 1))));
		xh.setAttribute('x1', P[k][0]); xh.setAttribute('x2', P[k][0]);
		dot.setAttribute('cx', P[k][0]); dot.setAttribute('cy', P[k][1]);
		ro.textContent = fmt(k);
		ev.stopPropagation();
	};
	svg.addEventListener('pointerdown', pick);
	svg.addEventListener('pointermove', pick);
}
function sparkSvg(vals){
	var W = Math.min(496, innerWidth - 64), H = 44, n = vals.length;
	var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
	if(min === max){ min -= 1; max += 1; }
	var pts = [];
	for(var k = 0; k < n; k++)
		pts.push((3 + k * (W - 10) / (n - 1)).toFixed(1) + ',' + (4 + (1 - (vals[k] - min) / (max - min)) * (H - 8)).toFixed(1));
	var lp = pts[n - 1].split(',');
	return '<svg class="spark" width="' + W + '" height="' + H + '">'
		+ '<polyline points="' + pts.join(' ') + '"/>'
		+ '<circle cx="' + lp[0] + '" cy="' + lp[1] + '" r="3.5"/></svg>';
}

/* ================= main pane rendering ================= */
function renderStat(){
	var t = S.cal.d[today()] || [], sum = calSum(t);
	var kc = document.getElementById('kc'), kw = document.getElementById('kw');
	kc.innerHTML = '<b>' + sum + '</b>' + (S.cal.b ? '/' + S.cal.b : '') + '&nbsp;kcal';
	kc.classList.toggle('over', !!(S.cal.b && sum > S.cal.b));
	kw.innerHTML = '<b>' + (S.wt.length ? S.wt[S.wt.length - 1].kg : '–') + '</b>&nbsp;kg';
}

function setValHtml(w, reps){
	return '<span class="num">' + w + '</span><small> kg</small> <span class="num">× ' + reps + '</span>';
}

function renderSession(){
	var rname = view.r, sess = todaySession(rname);
	var routine = routineByName(rname);
	var names = routine ? routine.ex.slice() : [];
	if(sess) Object.keys(sess.sets).forEach(function(n){ if(names.indexOf(n) < 0) names.push(n); });

	var html = '', total = 0, confirmed = 0;
	names.forEach(function(n){
		var def = exByName(n) || {name:n, min:1, max:99, inc:2.5};
		var next = computeNext(def);
		var entry = sess && sess.sets[n];
		var hist = histFor(n, true);
		var last = hist.length ? hist[hist.length - 1] : null;
		var rowsH = '';
		for(var si = 0; si < 2; si++){
			var loggedReps = entry && entry.r[si] != null ? entry.r[si] : null;
			total++;
			if(loggedReps != null) confirmed++;
			var valH = loggedReps != null ? setValHtml(entry.w, loggedReps)
				: entry ? setValHtml(entry.w, next ? next.reps : def.min)   // sibling set logged: weight is shared
				: next ? setValHtml(next.w, next.reps)
				: '<span class="num">—</span>';
			rowsH += '<div class="setrow' + (loggedReps != null ? ' done' : '') + '">'
				+ '<span class="setno num">' + (si + 1) + '</span>'
				+ '<button class="setval" data-act="edit" data-n="' + esc(n) + '" data-s="' + si + '">' + valH + '</button>'
				+ '<button class="confirm" data-act="confirm" data-n="' + esc(n) + '" data-s="' + si + '">✓</button>'
				+ '</div>';
		}
		html += '<div class="xcard">'
			+ '<button class="xhead" data-act="detail" data-n="' + esc(n) + '">'
			+ '<span class="xname">' + esc(n) + '</span>'
			+ '<span class="xlast num">' + (last ? 'last ' + last.w + '×' + last.r[0] + (last.r[1] != null ? ',' + last.r[1] : '') : 'new') + '</span>'
			+ '<span class="chev">›</span></button>'
			+ rowsH + '</div>';
	});
	html += '<button class="addx" data-act="pickex">＋&nbsp; add exercise</button>';
	rows.innerHTML = html;

	var allDone = total > 0 && confirmed === total;
	titleEl.innerHTML = esc(rname) + (allDone ? ' <span class="done">✓</span>' : '');
	subEl.textContent = allDone
		? 'completed · ' + names.length + ' exercise' + (names.length === 1 ? '' : 's')
		: (rname === suggested() && lastDone(rname) !== today() ? 'due · ' : '') + 'last done ' + daysAgoStr(lastDone(rname));
}

function renderProgress(){
	var rname = view.r, routine = routineByName(rname);
	var names = routine ? routine.ex.slice() : [];
	if(!routine) S.sessions.forEach(function(s){ if(s.r === rname) Object.keys(s.sets).forEach(function(n){ if(names.indexOf(n) < 0) names.push(n); }); });

	var html = '';
	names.forEach(function(n){
		var hist = histFor(n, false);
		var vals = hist.map(function(e){ return e1rm(e.w, e.r[0]); });
		var lastE = hist.length ? hist[hist.length - 1] : null;
		var body;
		if(vals.length >= 2){
			var pct = Math.round((vals[vals.length - 1] / vals[0] - 1) * 100);
			body = sparkSvg(vals)
				+ '<div class="pfoot"><span class="num">e1RM ' + Math.round(vals[vals.length - 1]) + ' kg</span>'
				+ '<span class="delta num">' + (pct >= 0 ? '+' : '') + pct + '% · ' + vals.length + ' sessions</span></div>';
		}else{
			body = '<div class="pfoot"><span>' + (vals.length ? 'one session logged — trend soon' : 'nothing logged yet') + '</span></div>';
		}
		html += '<button class="xcard pcard" data-act="detail" data-n="' + esc(n) + '">'
			+ '<div class="phead"><span class="xname">' + esc(n) + '</span>'
			+ '<span class="xlast num">' + (lastE ? 'now ' + lastE.w + '×' + lastE.r[0] : '') + '</span></div>'
			+ body + '</button>';
	});
	rows.innerHTML = html || '<p class="note">nothing here yet</p>';
	titleEl.textContent = rname;
	subEl.textContent = sessCount(rname) + ' sessions · last done ' + daysAgoStr(lastDone(rname));
}

function renderDrawer(){
	var sugg = suggested(), h = '';

		if(used.indexOf(e.name) >= 0) return;
		rowsH += '<button class="frow" data-act="pick" data-n="' + esc(e.name) + '"><span>' + esc(e.name) + '</span>'
			+ '<span class="end num">' + e.min + '–' + e.max + '</span></button>';
	});
	fbody.innerHTML =
		'<div class="ftitle">Add exercise</div>'
		+ '<div class="fsub">to today’s ' + esc(view.r) + '</div>'
		+ (rowsH ? '<div class="flist">' + rowsH + '</div>' : '<p class="note">every exercise is already in this session</p>')
		+ '<button class="cta plain" data-act="exedit" data-n="">＋ New exercise</button>';
	showCard();
}

function openSettings(){
	fbody.innerHTML =
		'<div class="ftitle">Settings</div>'
		+ '<div class="flist">'
		+ '<button class="frow" data-act="theme"><span>Theme</span><span class="end" id="thlabel"></span></button>'
		+ '<button class="frow" data-act="budget"><span>Daily kcal budget</span><span class="end num">' + (S.cal.b || 'off') + '</span></button>'
		+ '<button class="frow" data-act="manager"><span>Exercises & routines</span><span class="end">›</span></button>'
		+ '<button class="frow" data-act="export"><span>Export</span><span class="end">›</span></button>'
		+ '<button class="frow" data-act="import"><span>Import</span><span class="end">replaces data</span></button>'
		+ '<button class="frow" data-act="about"><span>Progression rules</span><span class="end">›</span></button>'
		+ '</div>';
	showCard();
	syncThemeLabel();
}
function syncThemeLabel(){
	var el = document.getElementById('thlabel');
	if(el) el.textContent = document.documentElement.dataset.theme === 'dark' ? 'Dark' : 'Light';
}

function openManager(){
	var rH = '';
	S.routines.forEach(function(r, i){
		rH += '<button class="frow" data-act="rtedit" data-i="' + i + '"><span>' + esc(r.name) + '</span>'
			+ '<span class="end num">' + r.ex.length + ' exercises</span></button>';
	});
	var eH = '';
	S.ex.forEach(function(e){
		eH += '<button class="frow" data-act="exedit" data-n="' + esc(e.name) + '"><span>' + esc(e.name) + '</span>'
			+ '<span class="end num">' + e.min + '–' + e.max + (e.inc ? ' · +' + e.inc : ' · off') + '</span></button>';
	});
	fbody.innerHTML =
		'<div class="ftitle">Exercises & routines</div>'
		+ '<div class="fsub">ROUTINES</div>'
		+ '<div class="flist">' + rH + '<button class="frow" data-act="rtedit" data-i="-1"><span>＋ New routine</span></button></div>'
		+ '<div class="fsub" style="margin-top:16px">EXERCISES</div>'
		+ '<div class="flist">' + eH + '<button class="frow" data-act="exedit" data-n=""><span>＋ New exercise</span></button></div>';
	showCard();
}

var editEx = null;   // original name being edited, '' = new
function openExEdit(n){
	editEx = n;
	var e = n ? exByName(n) : {name:'', min:8, max:12, inc:2.5};
	var checks = '';
	S.routines.forEach(function(r, i){
		var inR = n && r.ex.indexOf(n) >= 0;
		checks += '<label class="frow"><span>' + esc(r.name) + '</span>'
			+ '<input class="end" type="checkbox" data-rt="' + i + '"' + (inR ? ' checked' : '') + '></label>';
	});
	fbody.innerHTML =
		'<div class="ftitle">' + (n ? 'Edit exercise' : 'New exercise') + '</div>'
		+ '<input class="plain" id="xn" placeholder="name" value="' + esc(e.name) + '">'
		+ '<div style="display:flex; gap:8px">'
		+ '<input class="plain num" id="xmin" type="text" inputmode="numeric" placeholder="min reps" value="' + e.min + '">'
		+ '<input class="plain num" id="xmax" type="text" inputmode="numeric" placeholder="max reps" value="' + e.max + '">'
		+ '<input class="plain num" id="xinc" type="text" inputmode="decimal" placeholder="+kg" value="' + e.inc + '">'
		+ '</div>'
		+ '<div class="fsub" style="margin:14px 0 0">min · max · increment (0 = progression off)</div>'
		+ '<div class="flist">' + checks + '</div>'
		+ '<button class="cta" data-act="exsave">Save</button>'
		+ (n ? '<button class="cta danger" data-act="exdel">Delete exercise</button>' : '');
	showCard();
}

var editRt = -1;
function openRtEdit(i){
	editRt = i;
	var r = i >= 0 ? S.routines[i] : {name:'', ex:[]};
	var checks = '';
	S.ex.forEach(function(e){
		checks += '<label class="frow"><span>' + esc(e.name) + '</span>'
			+ '<input class="end" type="checkbox" data-xn="' + esc(e.name) + '"' + (r.ex.indexOf(e.name) >= 0 ? ' checked' : '') + '></label>';
	});
	fbody.innerHTML =
		'<div class="ftitle">' + (i >= 0 ? 'Edit routine' : 'New routine') + '</div>'
		+ '<input class="plain" id="rn" placeholder="name" value="' + esc(r.name) + '">'
		+ '<div class="flist">' + checks + '</div>'
		+ '<button class="cta" data-act="rtsave">Save</button>'
		+ (i >= 0 ? '<button class="cta danger" data-act="rtdel">Delete routine</button>' : '');
	showCard();
}

function openAbout(){
	fbody.innerHTML =
		'<div class="ftitle">Progression rules</div>'
		+ '<div class="fsub">two heavy sets · double progression</div>'
		+ '<p style="font-size:15px; letter-spacing:0; color:var(--label-2); line-height:1.5">'
		+ 'Each exercise has a rep range. The suggested target comes from your last session:<br><br>'
		+ '<b style="color:var(--label)">add weight</b> — set 1 hit the top of the range and set 2 stayed in range: load +increment, reps reset to the bottom.<br>'
		+ '<b style="color:var(--label)">hold</b> — set 1 in range but below the top: same load, one more rep.<br>'
		+ '<b style="color:var(--label)">repeat</b> — set 1 under the range: same target again.<br>'
		+ '<b style="color:var(--label)">deload</b> — three sessions in a row under the range: load −increment.<br><br>'
		+ 'Increment 0 turns progression off — sets are just recorded.</p>';
	showCard();
}

/* ================= data actions ================= */
function confirmSet(n, si){
	var def = exByName(n) || {name:n, min:1, max:99, inc:2.5};
	var sess = todaySession(view.r);
	var entry = sess && sess.sets[n];
	if(entry && entry.r[si] != null){                    // un-log
		entry.r[si] = null;
		cleanupSession(sess);
		save(); render();
		return;
	}
	var next = computeNext(def);
	if(!next && !entry){ openStepper(n, si); return; }   // baseline: needs a weight first
	sess = ensureSession(view.r);
	entry = sess.sets[n] || (sess.sets[n] = {w:(next ? next.w : 20), r:[null, null]});
	if(entry.r[0] == null && entry.r[1] == null && next) entry.w = next.w;
	entry.r[si] = next ? next.reps : def.min;
	save(); render();
}

function logSet(){
	var sess = ensureSession(view.r);
	var entry = sess.sets[stepState.n] || (sess.sets[stepState.n] = {w:stepState.w, r:[null, null]});
	entry.w = stepState.w;                               // one weight per exercise per session
	entry.r[stepState.si] = stepState.reps;
	save(); render(); closeCard();
}

function delHistEntry(n, d){
	for(var i = 0; i < S.sessions.length; i++){
		var s = S.sessions[i];
		if(s.d === d && s.sets[n]){
			delete s.sets[n];
			if(!Object.keys(s.sets).length) S.sessions.splice(i, 1);
			break;
		}
	}
	save(); render(); openDetail(n);
}

function saveExercise(){
	var name = document.getElementById('xn').value.trim();
	var min = parseInt(document.getElementById('xmin').value, 10);
	var max = parseInt(document.getElementById('xmax').value, 10);
	var inc = parseFloat(String(document.getElementById('xinc').value).replace(',', '.'));
	if(!name || isNaN(min) || isNaN(max) || min < 1 || min > max || isNaN(inc) || inc < 0) return;
	if(!editEx && exByName(name)) return;                // no duplicate names
	if(editEx && name !== editEx && exByName(name)) return;
	var e;
	if(editEx){
		e = exByName(editEx);
		if(name !== editEx){                              // rename everywhere
			S.routines.forEach(function(r){ var k = r.ex.indexOf(editEx); if(k >= 0) r.ex[k] = name; });
			S.sessions.forEach(function(s){ if(s.sets[editEx]){ s.sets[name] = s.sets[editEx]; delete s.sets[editEx]; } });
		}
		e.name = name; e.min = min; e.max = max; e.inc = inc;
	}else{
		e = {name:name, min:min, max:max, inc:inc};
		S.ex.push(e);
	}
	var boxes = fbody.querySelectorAll('input[data-rt]');
	for(var i = 0; i < boxes.length; i++){
		var r = S.routines[+boxes[i].getAttribute('data-rt')];
		var k = r.ex.indexOf(name);
		if(boxes[i].checked && k < 0) r.ex.push(name);
		if(!boxes[i].checked && k >= 0) r.ex.splice(k, 1);
	}
	save(); render(); openManager();
}

var armDel = null;   // two-tap delete (native confirm() is unreliable on mobile)
function armOrRun(key, btn, fn){
	if(armDel === key){ armDel = null; fn(); return; }
	armDel = key;
	btn.textContent = 'Tap again to delete';
	setTimeout(function(){ if(armDel === key) armDel = null; }, 3000);
}

function deleteExercise(){
	var n = editEx;
	S.ex = S.ex.filter(function(e){ return e.name !== n; });
	S.routines.forEach(function(r){ var k = r.ex.indexOf(n); if(k >= 0) r.ex.splice(k, 1); });
	save(); render(); openManager();
}

function saveRoutine(){
	var name = document.getElementById('rn').value.trim();
	if(!name) return;
	var clash = routineByName(name);
	var r;
	if(editRt >= 0){
		r = S.routines[editRt];
		if(clash && clash !== r) return;
		if(name !== r.name){
			S.sessions.forEach(function(s){ if(s.r === r.name) s.r = name; });
			if(view.r === r.name) view.r = name;
			r.name = name;
		}
	}else{
		if(clash || name === ADHOC) return;
		r = {name:name, ex:[]};
		S.routines.push(r);
	}
	var boxes = fbody.querySelectorAll('input[data-xn]');
	r.ex = [];
	for(var i = 0; i < boxes.length; i++)
		if(boxes[i].checked) r.ex.push(boxes[i].getAttribute('data-xn'));
	save(); render(); openManager();
}

function deleteRoutine(){
	var r = S.routines[editRt];
	S.routines.splice(editRt, 1);
	if(view.r === r.name){ view = {t:'session', r:suggested()}; }
	save(); render(); openManager();
}

function exportData(){
	var blob = new Blob([JSON.stringify(S)], {type:'application/json'});
	var url = URL.createObjectURL(blob);
	var a = document.createElement('a');
	a.href = url; a.download = 'workout.json';
	document.body.appendChild(a); a.click(); document.body.removeChild(a);
	URL.revokeObjectURL(url);
	closeCard();
}

function importData(file){
	var reader = new FileReader();
	reader.onload = function(){
		try{
			var p = JSON.parse(reader.result), st = null;
			if(validState(p)) st = p;
			else if(Array.isArray(p)) st = migrateOld(p, null, null);                 // legacy bare array
			else if(p && Array.isArray(p.ex) && p.ex.length && p.ex[0].grp !== undefined)
				st = migrateOld(p.ex, p.cal, p.wt);                                    // legacy {ex,cal,wt}
			if(!st) throw 0;
			S = st; save();
			view = {t:'session', r:suggested()};
			render(); closeCard();
		}catch(e){ alert('could not import: not a valid workout file'); }
	};
	reader.readAsText(file);
}

/* ================= theme / sync / init ================= */
function toggleTheme(){
	var t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
	document.documentElement.dataset.theme = t;
	try{ localStorage.setItem('wtheme', t); }catch(e){}
	document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0d0d0d' : '#ffffff';
	syncThemeLabel();
}

function reloadState(){                                  // rehydrate: frozen mobile tabs hold stale state
	S = load();
	if(view.t === 'session' && !routineByName(view.r) && view.r !== ADHOC) view.r = suggested();
	render();
}

document.addEventListener('DOMContentLoaded', function(){
	fcard = document.getElementById('fcard');
	fbody = document.getElementById('fbody');
	rows = document.getElementById('cards');
	titleEl = document.getElementById('title');
	subEl = document.getElementById('subtitle');

	S = load();
	if(!localStorage.getItem(KEY)) save();
	view = {t:'session', r:suggested()};
	document.querySelector('meta[name="theme-color"]').content =
		document.documentElement.dataset.theme === 'dark' ? '#0d0d0d' : '#ffffff';
	render();

	window.addEventListener('pageshow', function(e){ if(e.persisted) reloadState(); });
	document.addEventListener('visibilitychange', function(){ if(!document.hidden) reloadState(); });
	window.addEventListener('storage', reloadState);

	/* one delegated listener */
	document.addEventListener('click', function(e){
		var t = e.target.closest('[data-act]');
		if(!t) return;
		if(t.tagName === 'A') e.preventDefault();
		var act = t.getAttribute('data-act');
		var n = t.getAttribute('data-n');

		if(act === 'menu') document.documentElement.classList.toggle('is-open');
		else if(act === 'routine'){ view = {t:'session', r:n}; render(); document.documentElement.classList.remove('is-open'); }
		else if(act === 'adhoc'){ view = {t:'session', r:ADHOC}; render(); document.documentElement.classList.remove('is-open'); }
		else if(act === 'progress'){ view = {t:'progress', r:n}; render(); document.documentElement.classList.remove('is-open'); }
		else if(act === 'confirm') confirmSet(n, +t.getAttribute('data-s'));
		else if(act === 'edit') openStepper(n, +t.getAttribute('data-s'));
		else if(act === 'detail') openDetail(n);
		else if(act === 'pickex') openPicker();
		else if(act === 'pick'){
			var sess = ensureSession(view.r);
			if(!sess.sets[n]){
				var def = exByName(n), nx = def && computeNext(def);
				sess.sets[n] = {w:nx ? nx.w : 20, r:[null, null]};
			}
			save(); render(); closeCard();
		}
		else if(act === 'st'){
			var f = t.getAttribute('data-f'), d = +t.getAttribute('data-d');
			if(f === 'w') stepState.w = Math.max(0, num(stepState.w + d * stepState.inc));
			else stepState.reps = Math.max(1, stepState.reps + d);
			stepRefresh();
		}
		else if(act === 'typeval'){
			var f2 = t.getAttribute('data-f');
			var inp = document.createElement('input');
			inp.type = 'text'; inp.inputMode = f2 === 'w' ? 'decimal' : 'numeric';
			inp.className = 'num';
			inp.value = f2 === 'w' ? stepState.w : stepState.reps;
			t.replaceWith(inp); inp.focus(); inp.select();
			var committed = false;
			var commit = function(){
				if(committed) return;                     // blur + Enter must not double-fire
				committed = true;
				var v = parseFloat(String(inp.value).replace(',', '.'));
				if(!isNaN(v) && v >= 0){ if(f2 === 'w') stepState.w = num(v); else stepState.reps = Math.max(1, Math.round(v)); }
				inp.replaceWith(valBtn(f2));              // restore just this control; keep the typed value
			};
			inp.addEventListener('blur', commit);
			inp.addEventListener('change', commit);       // iOS "Done" on the number pad
			inp.addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); commit(); } });
		}
		else if(act === 'stsave') logSet();
		else if(act === 'hdel') delHistEntry(n, t.getAttribute('data-d'));
		else if(act === 'cal') openCal();
		else if(act === 'calsave'){
			var v = parseInt(document.getElementById('cv').value, 10);
			if(!isNaN(v) && v > 0){
				var nm = document.getElementById('cn').value.trim();
				(S.cal.d[today()] = S.cal.d[today()] || []).push(nm ? {v:v, n:nm} : v);
				save(); renderStat(); openCal();          // stay open for the next item
			}
		}
		else if(act === 'cdel'){
			var arr = S.cal.d[today()];
			if(arr){ arr.splice(+t.getAttribute('data-e'), 1); if(!arr.length) delete S.cal.d[today()]; }
			save(); renderStat(); openCal();
		}
		else if(act === 'budget') openBudget();
		else if(act === 'budgetsave'){
			var b = parseInt(document.getElementById('cb').value, 10);
			S.cal.b = isNaN(b) || b < 0 ? 0 : b;
			save(); renderStat(); openCal();
		}
		else if(act === 'wt') openWt();
		else if(act === 'wtsave'){
			var wv = parseFloat(String(document.getElementById('wv').value).replace(',', '.'));
			if(!isNaN(wv) && wv > 0){
				var lastW = S.wt.length ? S.wt[S.wt.length - 1] : null;
				if(lastW && lastW.d === today()) lastW.kg = wv;
				else { S.wt.push({d:today(), kg:wv}); S.wt.sort(function(a, b){ return a.d < b.d ? -1 : 1; }); }
				save(); renderStat(); closeCard();
			}
		}
		else if(act === 'wdel'){ S.wt.splice(+t.getAttribute('data-e'), 1); save(); renderStat(); openWt(); }
		else if(act === 'settings'){ document.documentElement.classList.remove('is-open'); openSettings(); }
		else if(act === 'manager') openManager();
		else if(act === 'exedit') openExEdit(n || '');
		else if(act === 'exsave') saveExercise();
		else if(act === 'exdel') armOrRun('ex:' + editEx, t, deleteExercise);
		else if(act === 'rtedit') openRtEdit(+t.getAttribute('data-i'));
		else if(act === 'rtsave') saveRoutine();
		else if(act === 'rtdel') armOrRun('rt:' + editRt, t, deleteRoutine);
		else if(act === 'export') exportData();
		else if(act === 'import') document.getElementById('importfile').click();
		else if(act === 'about') openAbout();
		else if(act === 'theme') toggleTheme();
		else if(act === 'close') closeCard();
	});

	document.getElementById('importfile').addEventListener('change', function(e){
		if(e.target.files[0]) importData(e.target.files[0]);
		e.target.value = '';
	});

	/* drag-to-dismiss anywhere on the card (graph included); interactive elements excluded */
	(function(){
		var fb = document.getElementById('fbody');
		var y0 = null, lastY = 0, lastT = 0, v = 0, engaged = false, pid = null;
		fcard.addEventListener('pointerdown', function(e){
			if(e.target.closest('button, input, a, .chart')) return;
			y0 = lastY = e.clientY; lastT = e.timeStamp; v = 0; engaged = false; pid = e.pointerId;
		});
		fcard.addEventListener('pointermove', function(e){
			if(y0 === null || e.pointerId !== pid) return;
			var dt = e.timeStamp - lastT;
			if(dt > 0) v = (e.clientY - lastY) / dt;
			lastY = e.clientY; lastT = e.timeStamp;
			var dy = e.clientY - y0;
			if(!engaged){
				if(dy > 8 && fb.scrollTop <= 0){
					engaged = true;
					fcard.style.transition = 'none';
					try{ fcard.setPointerCapture(pid); }catch(x){}
					var a = document.activeElement;
					if(a && a.blur) a.blur();
				} else if(dy < -8){ y0 = null; return; }
			}
			if(engaged) fcard.style.transform = 'translateY(' + (dy < 0 ? dy * 0.2 : dy) + 'px)';
		});
		function end(e){
			if(y0 === null || e.pointerId !== pid) return;
			var dy = lastY - y0;
			fcard.style.transition = '';
			fcard.style.transform = '';
			if(engaged && (dy > fcard.getBoundingClientRect().height * 0.25 || v > 0.5)) closeCard();
			y0 = null; engaged = false; pid = null;
		}
		fcard.addEventListener('pointerup', end);
		fcard.addEventListener('pointercancel', end);
	})();

	fcard.addEventListener('click', function(e){ if(e.target === fcard) closeCard(); });
	fcard.addEventListener('focusin', function(e){
		if(e.target && e.target.tagName === 'INPUT')
			setTimeout(function(){ try{ e.target.scrollIntoView({block:'center', behavior:'smooth'}); }catch(x){} }, 300);
	});
	fcard.addEventListener('cancel', function(e){ e.preventDefault(); closeCard(); });   // Esc animates too

	if(window.visualViewport){
		var vv = window.visualViewport;
		var syncKb = function(){
			var inset = innerHeight - vv.height - vv.offsetTop;
			document.documentElement.style.setProperty('--kb', Math.max(0, inset) + 'px');
		};
		vv.addEventListener('resize', syncKb);
		vv.addEventListener('scroll', syncKb);
	}
});
</script>
